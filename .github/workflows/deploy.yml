site_name: HueyBot - Investment Psychology Assistant
site_description: Intelligent investment assistant
site_author: HueySeo Team
site_url: https://hueyseo.github.io/hueybot/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - toc.integrate
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Light mode

nav:
  - Home: index.md
  - Chapter 1: chapter-1-overview.md
  - Chapter 2: chapter-2-features.md
  - Chapter 3: chapter-3-how-it-works.md
  - Chapter 4: chapter-4-getting-started.md
  - Chapter 5: chapter-5-examples.md
  - Chapter 6: chapter-6-tech-stack.md
  - Chapter 7: chapter-7-roadmap.md
  - Chapter 8: chapter-8-support.md

plugins:
  - search

markdown_extensions:
  - pymdownx.emoji
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.highlight
  - admonition
  - tables
  - toc:
      permalink: true
