site_name: HueyBot

nav:
  - Home: index.md
  - Chapter 1: chapter1.md
  - Chapter 2: chapter2.md
  - Chapter 3: chapter3.md
  - Chapter 4: chapter4.md
  - Chapter 5: chapter5.md
  - Chapter 6: chapter6.md
  - Chapter 7: chapter7.md
  - Chapter 8: chapter8.md

theme:
  name: material
  icon: material

markdown_extensions:
  - toc:
      permalink: true
  - footnotes
  - codehilite:
      guess_lang: false

search:
  search: true
  language: en
  max_search_results: 100

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HueySeo/hueybot

# Additional options can be explored in the documentation.
